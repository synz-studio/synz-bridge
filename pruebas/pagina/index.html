<!doctype html>
<meta charset="utf-8">
<title>Pruebas del cliente del puente</title>
<script type="module">
  import { PuenteCliente, ErrorPuente } from '/cliente/puente-cliente.js';
  window.PuenteCliente = PuenteCliente;
  window.ErrorPuente = ErrorPuente;

  // Monta una instancia y la conecta a un grabador (solo para las pruebas).
  window.montar = async (url, nombrePlugin, opciones = {}) => {
    const ctx = new AudioContext();
    await ctx.resume();
    await ctx.audioWorklet.addModule('/pagina/captura-worklet.js');
    const puente = await PuenteCliente.conectar({ url });
    const lista = await puente.plugins();
    const plugin = lista.find((p) => p.nombre === nombrePlugin);
    const inst = await puente.crear(ctx, plugin.id, opciones);
    const cap = new AudioWorkletNode(ctx, 'captura', { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [2] });
    inst.out.connect(cap);
    cap.connect(ctx.destination);
    window.S = { ctx, puente, inst, cap };
    const conducto = opciones.calibrar === false ? null : await inst.esperarCalibracion();
    await new Promise((r) => setTimeout(r, 300));   // que el anillo se asiente antes de medir nada
    return { sr: ctx.sampleRate, conducto, latencia: inst.latenciaMuestras(), info: { nombre: inst.nombre, instrumento: inst.instrumento, parametros: inst.parametros.length } };
  };

  window.grabar = () => { window.S.cap.port.postMessage({ tipo: 'inicio' }); };
  window.terminarGrabacion = () => new Promise((res) => {
    window.S.cap.port.onmessage = (e) => res({ inicio: e.data.inicio, canal0: Array.from(e.data.canal0), canal1: Array.from(e.data.canal1) });
    window.S.cap.port.postMessage({ tipo: 'fin' });
  });
  window.esperar = (ms) => new Promise((r) => setTimeout(r, ms));
  window.listo = true;
</script>
